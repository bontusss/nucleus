info:
  contact: {}
  description: |
    Nucleus ERP is an open-source, API-first business suite designed for African businesses and beyond.
    It provides a modern, modular, and developer-friendly platform for managing core business operations.
    It also provides secure, scalable, and extensible endpoints for managing users, businesses, stores, inventory, suppliers, keys, and webhooks. Features include JWT authentication, API key support, rate limiting, activity logging, and comprehensive API documentation.

    ### Key Features
    - **Authentication & Authorization**: Secure user management with JWT-based access control.
    - **Business Management**: Create and manage businesses, branches, and organizational structures.
    - **Point of Sale (POS)**: Process sales, payments, and receipts with support for multi-branch operations.
    - **Inventory Management**: Track stock levels, suppliers, purchases, and transfers.
    - **Finance & Taxation**: Manage taxes, VAT, and financial records.
    - **Extensible via Webhooks & Events**: Trigger custom workflows (e.g., when a sale or inventory update occurs).
    - **Audit Logging**: Automatic logging of key user and system activities for compliance.

    ### Target Users
    - Small to medium businesses in Africa looking for ERP solutions tailored to their workflows.
    - Developers and integrators building custom business apps on top of Nucleus API.
    - Organizations needing a modular, open-source ERP that can be extended with plugins.

    ### Usage Notes
    - All requests must include a valid JWT token in the `Authorization` header.
    - API follows RESTful design and returns JSON responses.
    - File uploads (e.g., business logos) must be sent via multipart/form-data.

    ## Authentication
    - **JWT Token:** Obtain a token by POSTing to `/api/v1/auth/login` with valid credentials. Use the returned token in the `Authorization` header as `Bearer <token>`.
    - **API Key:** Admins can generate API keys via the `/api/v1/key/generate` endpoint (requires authentication). Use the API key in the `Authorization` header as `ApiKey <key>`.
    - See [API Docs](https://github.com/bontusss/nucleus) for more details.
  title: Nucleus ERP API
  version: 1.0.0
paths:
  /api/v1/admin/login-history:
    get:
      consumes:
      - application/json
      description: Retrieve login history for all users
      parameters:
      - description: Maximum number of logs to return (default 100, max 1000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get login history
      tags:
      - admin
  /api/v1/admin/roles:
    get:
      description: Get a list of all roles in the system
      produces:
      - application/json
      responses:
        "200":
          description: List of roles
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all roles
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Create a new role in the system
      parameters:
      - description: Role creation data
        in: body
        name: role
        required: true
        schema:
          $ref: '#/definitions/auth.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Role created successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a new role
      tags:
      - admin
  /api/v1/admin/roles/{id}:
    delete:
      description: Delete a role from the system
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Role deleted successfully
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete role
      tags:
      - admin
    get:
      description: Get detailed information about a specific role
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Role details
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Role not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get role by ID
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: Update role information
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      - description: Role update data
        in: body
        name: role
        required: true
        schema:
          $ref: '#/definitions/auth.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Role updated successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update role
      tags:
      - admin
  /api/v1/admin/roles/{id}/permission:
    get:
      consumes:
      - application/json
      description: Retrieve permissions for a specific role
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get role permissions
      tags:
      - admin
    post:
