  /api/v1/org:
    get:
      consumes:
      - application/json
      description: Retrieve all businesses owned by the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: List of businesses
          schema:
            items:
              $ref: '#/definitions/business.ListBusinessResponse'
            type: array
        "400":
          description: Invalid request
        "401":
          description: 'Unauthorized: missing or invalid token'
        "403":
          description: 'Forbidden: you do not have access'
        "500":
          description: Internal server error
      security:
      - BearerAuth: []
      summary: List organizations
      tags:
      - Organization
    post:
      consumes:
      - multipart/form-data
      description: |-
        Create a new business/organization record and link it to the authenticated user as the owner.

        ### Features
        - Accepts required and optional business details (name, email, website, tax ID, motto, etc.).
        - Allows uploading a business logo (JPG/PNG, max 2MB).
        - Supports attaching custom metadata as a JSON object.
        - Automatically sets the authenticated user as the owner of the business.
        - Logs the creation activity for auditing purposes.

        ### Notes
        - A default branch called "Main" is created automatically when creating an org.
        - The `metadata` field must be a valid JSON string. Example: {"industry":"Hospitality","branches":5}
        - The `logo` field must be a JPG or PNG image not exceeding 2MB.
        - On success, the response includes full business details, metadata, and timestamps.
        {
        "industry": "Hospitality",
        "branches": 5,
        "subscription": "premium"
        }
      parameters:
      - description: Business name
        in: formData
        name: name
        required: true
        type: string
      - description: Business email
        in: formData
        name: email
        type: string
      - description: Business website
        in: formData
        name: website
        type: string
      - description: Tax ID
        in: formData
        name: tax_id
        type: string
      - description: Motto
        in: formData
        name: motto
        type: string
      - description: Country of business
        in: formData
        name: country
        required: true
        type: string
      - description: VAT Number
        in: formData
        name: vat_number
        type: string
      - description: Business logo (JPG/PNG, max 2MB)
        in: formData
        name: logo
        type: file
      - description: Custom metadata in JSON format
        in: formData
        name: metadata
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/business.OrgWithBranchResponse'
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "500":
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Create an organization
      tags:
      - Organization
