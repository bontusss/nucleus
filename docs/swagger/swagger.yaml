securityDefinitions:
  ApiKeyAuth:
    description: 'API Key header using the ApiKey scheme. Example: "X-API-Key": ApiKey,
      "Value": {key}"'
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    description: 'JWT Authorization header using the Bearer scheme. Example: "Authorization:
      Bearer {token}"'
    in: header
    name: Authorization
    type: apiKey
